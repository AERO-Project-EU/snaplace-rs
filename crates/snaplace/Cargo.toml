[package]
name = "snaplace"
version.workspace = true
license.workspace = true
authors.workspace = true
edition.workspace = true


[features]
default = ["hasher-fold", "sched-setaffinity", "rt-fcctrd"]
rt-fc = [
    "dep:aho-corasick",
    "dep:async-pidfd",
    "dep:camino",
    "dep:dashmap",
    "dep:itoa",
    "dep:wick",
]
rt-fcctrd = [
    "dep:firecracker-containerd-client",
    "dep:ttrpc",
]
sched-setaffinity = []
uncache = []

# FunctionMetadataStore implementation
fmd-store-dash = ["dep:dashmap"]

# hasher
hasher-a = ["dep:ahash"]
hasher-fold = ["dep:foldhash"]
hasher-gx = ["dep:gxhash"]

__toy = ["dep:anyhow"]  # only for debugging/profiling
test-utils = ["dep:anyhow"]


[dependencies]
ahash = { version = "0.8", optional = true }
aho-corasick = { version = "1.1", optional = true }
anyhow = { workspace = true, optional = true }
arcstr = { version = "1.2", features = ["serde"] }
async-pidfd = { version = "0.1", optional = true }
async-trait = { workspace = true }
average = "0.17"
backon = { workspace = true }
base64 = "0.22"
camino = { workspace = true, features = ["serde1"], optional = true }
compact_str = { workspace = true, features = ["serde"] }
const_format = { workspace = true }
dashmap = { version = "6.2", default-features = false, features = ["inline"], optional = true }
either = "1.16"
enum-map = { version = "2.7", features = ["serde"] }
enum-map-derive = "0.17"
foldhash = { version = "0.2", optional = true }
futures = { workspace = true }
gxhash = { version = "3.5.0", optional = true }  #, features = ["hybrid"] }
http = { workspace = true }
humantime = "2"
humantime-serde = "1.1.1"
ipnet = { version = "2", features = ["serde"] }
itertools = { version = "0.14" }
itoa = { version = "1", optional = true }
libc = "0.2"
linux-raw-sys = { version = "0.12", features = ["net"] }
mac_address = { workspace = true, features = ["serde"] }
num-traits = "0.2"
priority-queue = "2"
prost = { workspace = true }
prost-types = { workspace = true }
rand = { version = "0.10", default-features = false, features = ["sys_rng"] }
redb = { workspace = true }
rmp-serde = "1.3"
rtnetlink = "0.21"
rustix = { version = "1.1", features = ["fs", "io_uring", "linux_5_1", "process", "thread"] }
scopeguard = { version = "1.2.0", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
smallvec = { version = "1.15", features = ["union", "const_generics", "const_new"] }
static_assertions = "1.1"
tempfile = "3"
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "net", "process", "signal", "sync", "time"] }  # "process": only fcctrd
tokio-stream = { workspace = true }
tokio-util =  "0.7"
tonic = { workspace = true }
tonic-prost = { workspace = true }
tracing = { workspace = true }
triomphe = { workspace = true }
ttrpc = { version = "0.9", default-features = false, optional = true }
ubyte = { workspace = true, features = ["serde"] }
uuid = { version = "1.23", features = ["v4", "fast-rng"] }
wick = { git = "https://github.com/ckatsak/wick-rs.git", version = "0.0.9-1.15.1", optional = true }

firecracker-containerd-client = { path = "../firecracker-containerd-client", features = ["serde"], optional = true }


[dev-dependencies]
anyhow = { workspace = true }
tracing-test = "0.2"


[build-dependencies]
anyhow = { workspace = true }
tonic-prost-build = { workspace = true }
vergen-gitcl = { version = "9", features = ["build", "cargo", "rustc", "si"] }


[lints]
workspace = true
